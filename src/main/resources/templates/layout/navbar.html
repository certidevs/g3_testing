<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-light bg-white sticky-top py-2">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center fw-bold" th:href="@{/}">
            <i class="fa-solid fa-door-open fs-3 me-2" style="color: #FF385C;"></i>
            <span class="fs-4 tracking-tight" style="color: #FF385C; font-weight: 800; letter-spacing: -0.5px;">openHouse</span>
        </a>

        <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav ms-auto align-items-center gap-2">
                <li class="nav-item">
                    <a class="nav-link px-3 py-2" th:href="@{/listings}">Propiedades</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link px-3 py-2" th:href="@{/bookings}">Reservas</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link px-3 py-2" th:href="@{/reviews}">Reseñas</a>
                </li>

                <li class="nav-item" sec:authorize="!hasRole('ADMIN')">
                    <a class="nav-link px-3 py-2" th:href="@{/conversation}">Mensajes</a>
                </li>

                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link px-3 py-2" th:href="@{/amenity}">Comodidades</a>
                </li>

                <li class="nav-item ms-lg-2" sec:authorize="!hasRole('ADMIN')">
                    <a class="btn btn-airbnb-outline px-4 py-2" th:href="@{/listings/new}">Anunciar tu casa</a>
                </li>

                <th:block sec:authorize="isAnonymous()">
                    <li class="nav-item">
                        <a class="nav-link px-3 py-2 fw-bold" th:href="@{/login}">Iniciar sesión</a>
                    </li>
                </th:block>

                <th:block sec:authorize="isAuthenticated()">
                    <li class="nav-item dropdown ms-lg-2">
                        <button class="nav-link dropdown-toggle d-flex align-items-center gap-2 px-3 py-2 border rounded-5 style-sidebar btn bg-white"
                                id="userMenu" role="button" data-bs-toggle="dropdown" aria-expanded="false" style="border-color: #DDDDDD !important; box-shadow: none;">

                            <i class="fa-solid fa-bars text-muted small"></i>

                            <div class="avatar-circle d-flex align-items-center justify-content-center" style="width: 30px; height: 30px; font-size: 0.8rem; background-color: #222222; color: #ffffff; border-radius: 50%; font-weight: 700;">
                                <span th:text="${#strings.substring(#authentication.name, 0, 1).toUpperCase()}">U</span>
                            </div>

                            <span class="fw-semibold text-dark small ms-1" th:text="${#authentication.name}">Usuario</span>
                        </button>

                        <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0 rounded-3 mt-2 p-2" aria-labelledby="userMenu" style="min-width: 200px;">
                            <li>
                                <a class="dropdown-item rounded-2 py-2 small" th:href="@{/profile}">
                                    <i class="fa-solid fa-circle-user me-2 text-muted"></i> Mi Perfil
                                </a>
                            </li>
                            <li sec:authorize="hasRole('ADMIN')">
                                <a class="dropdown-item rounded-2 py-2 small fw-semibold" th:href="@{/dashboard}">
                                    <i class="fa-solid fa-user-shield me-2 text-muted"></i> Gestión
                                </a>
                            </li>
                            <li><hr class="dropdown-divider my-1" style="color: #EBEBEB;"></li>
                            <li>
                                <form th:action="@{/logout}" method="post" class="m-0 p-0">
                                    <button type="submit" class="dropdown-item rounded-2 py-2 small text-danger fw-semibold border-0 bg-transparent w-100 text-start">
                                        <i class="fa-solid fa-arrow-right-from-bracket me-2"></i> Cerrar sesión
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </li>
                </th:block>
            </ul>
        </div>
    </div>
</nav>
</body>
</html>
