<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/head :: head('Listado de Amenities')}"></head>

<body class="d-flex flex-column min-vh-100 bg-light">

<nav th:replace="~{layout/navbar :: navbar}"></nav>

<main class="container flex-grow-1 my-4">

    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
        <h1 class="mb-0">
            <i class="fa-solid fa-couch text-primary me-2"></i>Amenities
        </h1>
        <span class="badge bg-secondary fs-6"
              th:text="${amenities != null} ? |${#lists.size(amenities)} amenities| : '0 amenities'">
            0 amenities
        </span>
    </div>

    <div class="mb-4">
        <a th:href="@{/amenity/new}" class="btn btn-success shadow-sm">
            <i class="fa-solid fa-plus me-1"></i>Agregar Nuevo Amenity
        </a>
    </div>

    <div th:if="${amenities == null or #lists.isEmpty(amenities)}" class="alert alert-light border text-center py-5">
        <i class="fa-regular fa-folder-open fa-2x mb-2 d-block text-muted"></i>
        <p class="mb-0 text-muted">Todavía no hay Amenities registrados</p>
    </div>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3"
         th:if="${amenities != null and !#lists.isEmpty(amenities)}">

        <div class="col" th:each="amenity : ${amenities}">
            <div class="card h-100 shadow-sm border-0">
                <div class="card-header bg-white d-flex justify-content-between align-items-center">
                    <span class="badge bg-info text-dark">
                        <i class="fa-solid fa-star me-1"></i>Servicio
                    </span>
                    <span class="text-primary">
                        <i th:class="${amenity.icon != null ? amenity.icon : 'fa-solid fa-tag'}"></i>
                    </span>
                </div>

                <div class="card-body">
                    <h5 class="card-title mb-2" th:text="${amenity.name}">Nombre del Amenity</h5>
                    <p class="card-text text-muted small mb-0"
                       th:text="${amenity.description != null ? amenity.description : 'Sin descripción'}">
                        Descripción
                    </p>
                </div>

                <div class="card-footer bg-white d-flex justify-content-between align-items-center">
                    <small class="text-muted text-truncate me-2" th:if="${amenity.listing != null}">
                        <i class="fa-solid fa-house text-danger me-1"></i>
                        <span th:text="${amenity.listing.title}">Propiedad</span>
                    </small>
                    <a th:href="@{/amenity/{id}(id=${amenity.id})}"
                       class="btn btn-sm btn-outline-primary flex-shrink-0">
                        <i class="fa-regular fa-eye me-1"></i>Ver
                    </a>
                </div>
            </div>
        </div>
    </div>

</main>

<footer th:replace="~{layout/footer :: footer}"></footer>
<script th:replace="~{layout/footer :: scripts}"></script>

</body>
</html>
