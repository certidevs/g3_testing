<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/head :: head('Detalle Amenity')}"></head>
<body class="d-flex flex-column min-vh-100 bg-light">

<nav th:replace="~{layout/navbar :: navbar}"></nav>

<main class="container flex-grow-1 my-5">

    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <div class="d-flex justify-content-between align-items-start mb-3">
                <h1 class="card-title h2 mb-0" th:text="${amenity.name}">Nombre del Amenity</h1>
                <span class="badge bg-info text-dark p-2">
                    <i class="fa-solid fa-star me-1"></i>Servicio
                </span>
            </div>

            <hr class="text-muted">

            <dl class="row mb-0">
                <dt class="col-sm-3 text-muted"><i class="fa-solid fa-fingerprint me-2"></i>ID Registro</dt>
                <dd class="col-sm-9" th:text="${amenity.id}"></dd>

                <dt class="col-sm-3 text-muted"><i class="fa-solid fa-circle-info me-2"></i>Descripción</dt>
                <dd class="col-sm-9" th:text="${amenity.description != null ? amenity.description : 'Sin descripción detallada'}"></dd>

                <dt class="col-sm-3 text-muted"><i class="fa-solid fa-icons me-2"></i>Icono</dt>
                <dd class="col-sm-9">
                    <i th:class="${amenity.icon != null ? amenity.icon : 'fa-solid fa-tag'}"></i>
                    <span class="ms-1 text-muted small" th:text="${amenity.icon != null ? amenity.icon : 'Por defecto'}"></span>
                </dd>
            </dl>
        </div>

        <div class="card-footer bg-white p-3" th:if="${amenity.listing != null}">
            <div class="d-flex align-items-center">
                <i class="fa-solid fa-house-circle-check text-primary me-2"></i>
                <span>Disponible en la propiedad: </span>
                <a class="fw-semibold ms-1 text-decoration-none"
                   th:href="@{/listing/{id}(id=${amenity.listing.id})}"
                   th:text="${amenity.listing.title}">Nombre de la Propiedad</a>
            </div>
        </div>
    </div>

    <div class="mt-5">
        <h2 class="h4 mb-4">
            <i class="fa-regular fa-comments text-primary me-2"></i>Información Adicional
        </h2>

        <div class="alert alert-light border shadow-sm">
            <div class="d-flex align-items-center">
                <i class="fa-solid fa-circle-exclamation text-info me-3 fa-2x"></i>
                <div>
                    <p class="mb-0 text-muted">Este amenity es gestionado por el propietario. Para más detalles sobre su uso o disponibilidad, consulte la guía de la propiedad.</p>
                </div>
            </div>
        </div>
    </div>

</main>

<footer th:replace="~{layout/footer :: footer}"></footer>
<script th:replace="~{layout/footer :: scripts}"></script>

</body>
</html>
