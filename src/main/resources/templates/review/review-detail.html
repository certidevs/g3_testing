<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{layout/head :: head('Detalle de Reseña - openHouse')}"></head>

<body class="d-flex flex-column min-vh-100" style="background-color: #ffffff;">

<nav th:replace="~{layout/navbar :: navbar}"></nav>

<main class="container my-5" style="max-width: 750px;">

    <div class="mb-4">
        <a th:href="@{/reviews}" class="btn btn-link text-secondary text-decoration-none p-0 fw-semibold small">
            <i class="fa-solid fa-arrow-left me-1"></i> Volver a todas las reseñas
        </a>
    </div>

    <div class="card p-4 border shadow-sm mb-5" style="border-radius: 20px; border-color: var(--border-light) !important; background-color: #ffffff;">
        <div class="card-body p-0">

            <div class="d-flex justify-content-between align-items-start flex-wrap gap-3 mb-4">

                <div class="d-flex align-items-center">
                    <div class="bg-light p-3 rounded-circle text-secondary me-3 d-flex align-items-center justify-content-center" style="width: 48px; height: 48px;">
                        <i class="fa-solid fa-comment-dots fs-5"></i>
                    </div>
                    <div>
                        <h1 class="h5 fw-bold text-dark mb-0" th:text="'Reseña #' + ${review.id}">Reseña #0</h1>
                        <span class="text-muted small" th:text="${#temporals.format(review.creationDate, 'dd/MM/yyyy - HH:mm')}">01/01/2026 00:00</span>
                    </div>
                </div>

                <div class="text-sm-end">
                    <div class="text-warning fs-5 mb-1">
                        <span th:each="i : ${#numbers.sequence(1, 5)}">
                            <i th:class="${i <= review.rating} ? 'fa-solid fa-star' : 'fa-regular fa-star'"></i>
                        </span>
                    </div>
                    <div class="d-flex justify-content-sm-end align-items-center gap-2 mt-1.5">
                        <span class="badge rounded-pill px-2.5 py-1 fw-bold small"
                              th:classappend="${review.verified} ? 'bg-success-subtle text-success border border-success-subtle' : 'bg-light text-muted border'">
                            <i th:class="${review.verified} ? 'fa-solid fa-circle-check' : 'fa-solid fa-circle'" style="font-size: 0.55rem;"></i>
                            <span class="ms-1" th:text="${review.verified ? 'Estancia verificada' : 'No verificada'}">Verificación</span>
                        </span>
                    </div>
                </div>
            </div>

            <div class="py-2 mb-4">
                <p class="text-dark lh-lg fs-5 mb-0" style="font-style: italic; white-space: pre-line;" th:text="'&ldquo;' + ${review.comment} + '&rdquo;'">
                    Comentario de la reseña
                </p>
            </div>

            <div th:if="${booking != null}" class="p-3 rounded-4 bg-light mt-4 border-0">
                <div class="row g-3">

                    <div class="col-sm-6 border-sm-end" style="border-color: var(--border-light) !important;">
                        <div class="d-flex align-items-center">
                            <div class="text-secondary me-2.5"><i class="fa-solid fa-house"></i></div>
                            <div class="text-truncate">
                                <span class="text-muted d-block" style="font-size: 0.75rem; font-weight: 700; letter-spacing: 0.5px;">PROPIEDAD</span>
                                <a th:href="@{/listings/{id}(id=${booking.listing.id})}"
                                   class="text-dark fw-bold text-decoration-none small hover-link" th:text="${booking.listing.title}">
                                    Nombre de la propiedad
                                </a>
                            </div>
                        </div>
                    </div>

                    <div class="col-sm-6">
                        <div class="d-flex align-items-center">
                            <div class="text-secondary me-2.5"><i class="fa-solid fa-calendar-check"></i></div>
                            <div class="text-truncate">
                                <span class="text-muted d-block" style="font-size: 0.75rem; font-weight: 700; letter-spacing: 0.5px;">RESERVA ASOCIADA</span>
                                <a th:href="@{/bookings/{id}(id=${booking.id})}"
                                   class="text-dark fw-bold text-decoration-none small hover-link" th:text="'Código #' + ${booking.id}">
                                    Reserva #ID
                                </a>
                                <span class="text-muted d-block" style="font-size: 0.75rem;"
                                      th:text="${#temporals.format(booking.checkIn, 'dd/MM/yyyy')} + ' al ' + ${#temporals.format(booking.checkOut, 'dd/MM/yyyy')}">
                                </span>
                            </div>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <div class="d-flex justify-content-between align-items-center border-top pt-4" style="border-color: var(--border-light) !important;">
        <div>
            <a th:href="@{/reviews}" class="btn btn-outline-secondary fw-bold px-4 py-2.5 rounded-3 small">
                Volver al listado
            </a>
        </div>

        <div th:if="${#authorization.expression('hasRole(''ADMIN'')') or review.booking.guest.id == #authentication.principal.id}">
            <form th:action="@{/reviews/delete/{id}(id=${review.id})}" method="post" class="m-0">
                <button type="submit" class="btn btn-outline-danger fw-bold px-4 py-2.5 rounded-3 small"
                        onclick="return confirm('¿Estás seguro de que deseas eliminar permanentemente este comentario?')">
                    <i class="fa-solid fa-trash-can me-1.5"></i> Eliminar reseña
                </button>
            </form>
        </div>
    </div>

</main>

<footer th:replace="~{layout/footer :: footer}"></footer>

</body>
</html>
