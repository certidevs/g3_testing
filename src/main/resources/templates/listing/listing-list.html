<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{layout/head :: head('Listings')}"></head>

<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{layout/navbar :: navbar}"></nav>

<main class="container flex-grow-1">

    <!-- Título + contador -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0">Listings</h1>
        <span class="badge bg-secondary fs-6"
              th:text="|${#lists.size(listings)} resultados|">0 resultados</span>
    </div>

    <!-- 🔽 FORMULARIO DE FILTROS 🔽 -->
    <form method="get" action="/listings" class="mb-4" autocomplete="off">
    <!-- 🟦 FILA 1 (6 columnas) -->
        <div class="row g-3">

            <div class="col-md-2"> <!-- Tipo -->
                <div class="input-group">
                <span class="input-group-text rounded-pill-start">
                    <i class="fa-solid fa-list"></i>
                </span>
                    <select name="type" class="form-select rounded-pill-end">
                        <option value="">Tipo</option>
                        <option th:each="t : ${types}"
                                th:value="${t}"
                                th:text="${t}"
                                th:selected="${selectedType == t}">
                        </option>
                    </select>
                </div>
            </div>

            <div class="col-md-2"> <!-- Min -->
                <div class="input-group">
                <span class="input-group-text rounded-pill-start">
                    <i class="fa-solid fa-euro-sign"></i>
                </span>
                    <input type="number" name="minPrice" class="form-control rounded-pill-end"
                           placeholder="Mínimo"
                           th:value="${selectedMinPrice}">
                </div>
            </div>

            <div class="col-md-2"> <!-- Max -->
                <div class="input-group">
                <span class="input-group-text rounded-pill-start">
                    <i class="fa-solid fa-euro-sign"></i>
                </span>
                    <input type="number" name="maxPrice" class="form-control rounded-pill-end"
                           placeholder="Máximo"
                           th:value="${selectedMaxPrice}">
                </div>
            </div>

            <div class="col-md-2"> <!-- Huéspedes -->
                <div class="input-group">
                <span class="input-group-text rounded-pill-start">
                    <i class="fa-solid fa-users"></i>
                </span>
                    <input type="number" name="guests" class="form-control rounded-pill-end"
                           placeholder="Huéspedes"
                           th:value="${selectedGuests}">
                </div>
            </div>

            <div class="col-md-2"> <!-- Noches -->
                <div class="input-group">
                <span class="input-group-text rounded-pill-start">
                    <i class="fa-solid fa-moon"></i>
                </span>
                    <input type="number" name="nights" class="form-control rounded-pill-end"
                           placeholder="Noches"
                           th:value="${selectedNights}">
                </div>
            </div>

            <div class="col-md-2 d-flex align-items-end"> <!-- FILTRAR -->
                <button type="submit" class="btn btn-primary w-100 rounded-pill">Filtrar</button>
            </div>

        </div>

        <!-- 🟦 FILA 2 (6 columnas, Limpiar debajo de Filtrar) -->
        <div class="row g-3 mt-1"
             th:with="hasFilters=
            ${selectedType != null
            or selectedMinPrice != null
            or selectedMaxPrice != null
            or selectedGuests != null
            or selectedNights != null
            or selectedCity != null
            or (startDate != null and startDate != '')
            or (endDate != null and endDate != '')}">
            <div class="col-md-2"> <!-- Ciudad -->
                <div class="input-group">
                <span class="input-group-text rounded-pill-start">
                    <i class="fa-solid fa-city"></i>
                </span>
                    <select name="city" class="form-select rounded-pill-end">
                        <option value="">Ciudad</option>
                        <option th:each="c : ${cities}"
                                th:value="${c}"
                                th:text="${c}"
                                th:selected="${selectedCity == c}">
                        </option>
                    </select>
                </div>
            </div>

            <div class="col-md-2"> <!-- Fecha entrada -->
                <div class="input-group">
                <span class="input-group-text rounded-pill-start">
                    <i class="fa-solid fa-calendar-day"></i>
                </span>
                    <input type="date" name="startDate" class="form-control rounded-pill-end"
                           th:value="${startDate}">
                </div>
            </div>

            <div class="col-md-2"> <!-- Fecha salida -->
                <div class="input-group">
                <span class="input-group-text rounded-pill-start">
                    <i class="fa-solid fa-calendar-check"></i>
                </span>
                    <input type="date" name="endDate" class="form-control rounded-pill-end"
                           th:value="${endDate}">
                </div>
            </div>

            <!-- 🟦 Columnas vacías para empujar LIMPIAR a la columna 6 -->
            <div class="col-md-2"></div>
            <div class="col-md-2"></div>

            <div class="col-md-2 d-flex align-items-end">
                <a href="/listings" class="btn btn-outline-secondary w-100 rounded-pill">Limpiar</a>
            </div>

        </div>

    </form>

    <!-- 🔼 FIN FORMULARIO 🔼 -->

    <div class="mb-3">

    <span th:if="${selectedType != null}" class="badge bg-light text-dark border rounded-pill px-3 py-2 me-2">
        <i class="fa-solid fa-list me-1"></i>
        <span th:text="${selectedType}"></span>
        <a th:href="@{/listings(type=,minPrice=${selectedMinPrice},maxPrice=${selectedMaxPrice},guests=${selectedGuests},nights=${selectedNights})}"
           class="ms-2 text-danger text-decoration-none">×</a>
    </span>

        <span th:if="${selectedMinPrice != null}" class="badge bg-light text-dark border rounded-pill px-3 py-2 me-2">
        <i class="fa-solid fa-euro-sign me-1"></i>
        Mín: <span th:text="${selectedMinPrice}"></span>
        <a th:href="@{/listings(type=${selectedType},maxPrice=${selectedMaxPrice},guests=${selectedGuests},nights=${selectedNights})}"
           class="ms-2 text-danger text-decoration-none">×</a>
    </span>

        <span th:if="${selectedMaxPrice != null}" class="badge bg-light text-dark border rounded-pill px-3 py-2 me-2">
        <i class="fa-solid fa-euro-sign me-1"></i>
        Máx: <span th:text="${selectedMaxPrice}"></span>
        <a th:href="@{/listings(type=${selectedType},minPrice=${selectedMinPrice},guests=${selectedGuests},nights=${selectedNights})}"
           class="ms-2 text-danger text-decoration-none">×</a>
    </span>

        <span th:if="${selectedGuests != null}" class="badge bg-light text-dark border rounded-pill px-3 py-2 me-2">
        <i class="fa-solid fa-users me-1"></i>
        <span th:text="${selectedGuests}"></span> huéspedes
        <a th:href="@{/listings(type=${selectedType},minPrice=${selectedMinPrice},maxPrice=${selectedMaxPrice},nights=${selectedNights})}"
           class="ms-2 text-danger text-decoration-none">×</a>
    </span>

        <span th:if="${selectedNights != null}" class="badge bg-light text-dark border rounded-pill px-3 py-2 me-2">
        <i class="fa-solid fa-moon me-1"></i>
        <span th:text="${selectedNights}"></span> noches
        <a th:href="@{/listings(type=${selectedType},minPrice=${selectedMinPrice},maxPrice=${selectedMaxPrice},guests=${selectedGuests})}"
           class="ms-2 text-danger text-decoration-none">×</a>
    </span>

    <span th:if="${selectedCity != null}" class="badge bg-light text-dark border rounded-pill px-3 py-2 me-2">
    <i class="fa-solid fa-city me-1"></i>
    <span th:text="${selectedCity}"></span>
    <a th:href="@{/listings(
        type=${selectedType},
        minPrice=${selectedMinPrice},
        maxPrice=${selectedMaxPrice},
        guests=${selectedGuests},
        nights=${selectedNights},
        startDate=${startDate},
        endDate=${endDate}
    )}" class="ms-2 text-danger text-decoration-none">×</a>
</span>

        <span th:if="${startDate != null}" class="badge bg-light text-dark border rounded-pill px-3 py-2 me-2">
    <i class="fa-solid fa-calendar-day me-1"></i>
    Desde: <span th:text="${startDate}"></span>
    <a th:href="@{/listings(
        type=${selectedType},
        minPrice=${selectedMinPrice},
        maxPrice=${selectedMaxPrice},
        guests=${selectedGuests},
        nights=${selectedNights},
        city=${selectedCity},
        endDate=${endDate}
    )}" class="ms-2 text-danger text-decoration-none">×</a>
</span>
        <span th:if="${endDate != null}" class="badge bg-light text-dark border rounded-pill px-3 py-2 me-2">
    <i class="fa-solid fa-calendar-check me-1"></i>
    Hasta: <span th:text="${endDate}"></span>
    <a th:href="@{/listings(
        type=${selectedType},
        minPrice=${selectedMinPrice},
        maxPrice=${selectedMaxPrice},
        guests=${selectedGuests},
        nights=${selectedNights},
        city=${selectedCity},
        startDate=${startDate}
    )}" class="ms-2 text-danger text-decoration-none">×</a>
</span>


    </div>

    <!-- Grid de tarjetas -->
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3">

        <div class="col" th:each="listing : ${listings}">
            <div class="card h-100 shadow-sm">

                <!-- Imagen opcional -->
                <img th:if="${listing.imageUrl != null}"
                     th:src="${listing.imageUrl}"
                     class="card-img-top"
                     alt="Imagen del listing">

                <div class="card-body">

                    <!-- Título -->
                    <h5 class="card-title">
                        <i class="fa-solid fa-house text-primary me-2"></i>
                        <span th:text="${listing.title}">Título</span>
                        <span th:if="${!listing.isActive}" class="badge bg-danger ms-2">Inactivo</span>
                    </h5>

                    <!-- Descripción corta -->
                    <p class="card-text" th:text="${listing.shortDescription}">
                        Descripción corta
                    </p>

                    <!-- Precio + huéspedes -->
                    <p class="card-text">

                        <span class="badge bg-success">
                            <i class="fa-solid fa-euro-sign me-1"></i>
                            <span th:text="${listing.pricePerNight}">0</span> €/noche
                        </span>

                        <span class="badge bg-info text-dark ms-2">
                            <i class="fa-solid fa-users me-1"></i>
                            <span th:text="${listing.maxGuests}">0</span> huéspedes
                        </span>

                    </p>

                </div>

                <!-- Footer con botón -->
                <div class="card-footer bg-transparent border-0 pt-0">
                    <div class="d-flex justify-content-between gap-2">

                        <!-- Ver detalle -->
                        <a class="btn btn-primary btn-sm flex-fill"
                           th:href="@{/listings/{id}(id=${listing.id})}">
                            Ver detalle
                        </a>

                        <!-- Editar -->
                        <a class="btn btn-warning btn-sm flex-fill"
                           th:href="@{/listings/edit/{id}(id=${listing.id})}"
                            sec:authorize="hasAnyRole('ROLE_HOST','ROLE_ADMIN')">
                            Editar
                        </a>

                        <!-- Activar / Desactivar -->
                        <form th:action="@{/listings/toggle/{id}(id=${listing.id})}" method="post" class="flex-fill"
                              sec:authorize="hasAnyRole('ROLE_HOST','ROLE_ADMIN')">
                            <button type="submit"
                                    th:class="${listing.isActive} ? 'btn btn-outline-danger btn-sm w-100' : 'btn btn-success btn-sm w-100'">
                                <span th:text="${listing.isActive} ? 'Desactivar' : 'Activar'"></span>
                            </button>
                        </form>

                    </div>
                </div>

            </div>
        </div>

    </div>

</main>

</body>
</html>
