<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{layout/head :: head('Alojamientos disponibles - openHouse')}"></head>

<body class="d-flex flex-column min-vh-100" style="background-color: #ffffff;">

<nav th:replace="~{layout/navbar :: navbar}"></nav>

<main class="container flex-grow-1 my-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0 fw-bold text-dark" style="letter-spacing: -0.5px;">Explorar alojamientos</h1>
        <span class="badge bg-light text-dark border px-3 py-2 rounded-pill fw-bold"
              style="border-color: var(--border-light) !important;"
              th:text="|${#lists.size(listings)} resultados|">0 resultados</span>
    </div>

    <div th:if="${priceRangeError}" class="alert alert-warning d-flex align-items-center gap-2 rounded-3 mb-4">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <span>El precio mínimo no puede ser mayor que el precio máximo.</span>
    </div>

    <form method="get" action="/listings" class="mb-4" autocomplete="off">
        <div class="row g-3">

            <div class="col-md-2"> <div class="input-group">
                <span class="input-group-text rounded-pill-start bg-light border-end-0 text-muted">
                    <i class="fa-solid fa-list"></i>
                </span>
                <select name="type" class="form-select rounded-pill-end bg-light small fw-medium">
                    <option value="">Tipo</option>
                    <option th:each="t : ${types}"
                            th:value="${t}"
                            th:text="${t}"
                            th:selected="${selectedType == t}">
                    </option>
                </select>
            </div>
            </div>

            <div class="col-md-2"> <div class="input-group">
                <span class="input-group-text rounded-pill-start bg-light border-end-0 text-muted">
                    <i class="fa-solid fa-euro-sign"></i>
                </span>
                <input type="number" name="minPrice" id="minPrice" class="form-control rounded-pill-end bg-light small"
                       placeholder="Mín. por noche"
                       th:value="${selectedMinPrice}">
            </div>
            </div>

            <div class="col-md-2"> <div class="input-group">
                <span class="input-group-text rounded-pill-start bg-light border-end-0 text-muted">
                    <i class="fa-solid fa-euro-sign"></i>
                </span>
                <input type="number" name="maxPrice" id="maxPrice"  class="form-control rounded-pill-end bg-light small"
                       placeholder="Máx. por noche"
                       th:value="${selectedMaxPrice}">
            </div>
            </div>

            <div class="col-md-2"> <div class="input-group">
                <span class="input-group-text rounded-pill-start bg-light border-end-0 text-muted">
                    <i class="fa-solid fa-users"></i>
                </span>
                <input type="number" name="guests" class="form-control rounded-pill-end bg-light small"
                       placeholder="Huéspedes"
                       th:value="${selectedGuests}">
            </div>
            </div>

            <div class="col-md-2"> <div class="input-group">
                <span class="input-group-text rounded-pill-start bg-light border-end-0 text-muted">
                    <i class="fa-solid fa-moon"></i>
                </span>
                <input type="number" name="nights" class="form-control rounded-pill-end bg-light small"
                       placeholder="Noches"
                       th:value="${selectedNights}">
            </div>
            </div>

            <div class="col-md-2 d-flex align-items-end"> <button type="submit" class="btn btn-airbnb w-100 rounded-pill fw-bold small">Filtrar</button>
            </div>

        </div>

        <div class="row g-3 mt-1"
             th:with="hasFilters=${selectedType != null or selectedMinPrice != null or selectedMaxPrice != null or selectedGuests != null or selectedNights != null or selectedCity != null or (startDate != null and startDate != '') or (endDate != null and endDate != '')}">
            <div class="col-md-2"> <div class="input-group">
                <span class="input-group-text rounded-pill-start bg-light border-end-0 text-muted">
                    <i class="fa-solid fa-city"></i>
                </span>
                <select name="city" class="form-select rounded-pill-end bg-light small fw-medium">
                    <option value="">Ciudad</option>
                    <option th:each="c : ${cities}"
                            th:value="${c}"
                            th:text="${c}"
                            th:selected="${selectedCity == c}">
                    </option>
                </select>
            </div>
            </div>

            <div class="col-md-2"> <div class="input-group">
                <span class="input-group-text rounded-pill-start bg-light border-end-0 text-muted">
                    <i class="fa-solid fa-calendar-day"></i>
                </span>
                <input type="date" name="startDate" id="startDate" class="form-control rounded-pill-end bg-light small"
                       th:value="${startDate}">
            </div>
            </div>

            <div class="col-md-2"> <div class="input-group">
                <span class="input-group-text rounded-pill-start bg-light border-end-0 text-muted">
                    <i class="fa-solid fa-calendar-check"></i>
                </span>
                <input type="date" name="endDate" id="endDate" class="form-control rounded-pill-end bg-light small"
                       th:value="${endDate}">
            </div>
            </div>

            <div class="col-md-2"> <div class="input-group">
                <span class="input-group-text rounded-pill-start bg-light border-end-0 text-muted">
                    <i class="fa-solid fa-arrow-down-wide-short"></i>
                </span>
                <select name="sort" class="form-select rounded-pill-end bg-light small fw-medium" onchange="this.form.submit()">
                    <option value="">Ordenar por</option>
                    <option value="priceAsc" th:selected="${selectedSort == 'priceAsc'}">Precio: menor a mayor</option>
                    <option value="priceDesc" th:selected="${selectedSort == 'priceDesc'}">Precio: mayor a menor</option>
                    <option value="dateNewest" th:selected="${selectedSort == 'dateNewest'}">Más recientes</option>
                    <option value="dateOldest" th:selected="${selectedSort == 'dateOldest'}">Más antiguos</option>
                    <option value="ratingDesc" th:selected="${selectedSort == 'ratingDesc'}">Mejor valorados</option>
                    <option value="ratingAsc" th:selected="${selectedSort == 'ratingAsc'}">Peor valorados</option>
                </select>
            </div>
            </div>

<!--            <div class="col-md-2"></div>-->

<!--            <div class="col-md-2 d-flex align-items-end">-->
<!--                <a href="/listings" class="btn btn-outline-secondary w-100 rounded-pill fw-bold small">Limpiar</a>-->
<!--            </div>-->

            <div class="col-md-2"></div>

            <div class="col-md-2 d-flex align-items-end">
                <a href="/listings" class="btn btn-outline-secondary w-100 rounded-pill fw-bold small">Limpiar</a>
            </div>

        </div>

    </form>
    <div class="mb-4">
        <span th:if="${selectedType != null}" class="badge bg-light text-dark border rounded-pill px-3 py-2 me-2" style="border-color: var(--border-light) !important;">
            <i class="fa-solid fa-list me-1 text-muted"></i>
            <span th:text="${selectedType}"></span>
            <a th:href="@{/listings(type=,minPrice=${selectedMinPrice},maxPrice=${selectedMaxPrice},guests=${selectedGuests},nights=${selectedNights})}" class="ms-2 text-danger text-decoration-none fw-bold">×</a>
        </span>

        <span th:if="${selectedMinPrice != null}" class="badge bg-light text-dark border rounded-pill px-3 py-2 me-2" style="border-color: var(--border-light) !important;">
            <i class="fa-solid fa-euro-sign me-1 text-muted"></i>
            Mín. por noche: <span th:text="${selectedMinPrice}"></span>
            <a th:href="@{/listings(type=${selectedType},maxPrice=${selectedMaxPrice},guests=${selectedGuests},nights=${selectedNights})}" class="ms-2 text-danger text-decoration-none fw-bold">×</a>
        </span>

        <span th:if="${selectedMaxPrice != null}" class="badge bg-light text-dark border rounded-pill px-3 py-2 me-2" style="border-color: var(--border-light) !important;">
            <i class="fa-solid fa-euro-sign me-1 text-muted"></i>
            Máx. por noche: <span th:text="${selectedMaxPrice}"></span>
            <a th:href="@{/listings(type=${selectedType},minPrice=${selectedMinPrice},guests=${selectedGuests},nights=${selectedNights})}" class="ms-2 text-danger text-decoration-none fw-bold">×</a>
        </span>

        <span th:if="${selectedGuests != null}" class="badge bg-light text-dark border rounded-pill px-3 py-2 me-2" style="border-color: var(--border-light) !important;">
            <i class="fa-solid fa-users me-1 text-muted"></i>
            <span th:text="${selectedGuests}"></span> huéspedes
            <a th:href="@{/listings(type=${selectedType},minPrice=${selectedMinPrice},maxPrice=${selectedMaxPrice},nights=${selectedNights})}" class="ms-2 text-danger text-decoration-none fw-bold">×</a>
        </span>

        <span th:if="${selectedNights != null}" class="badge bg-light text-dark border rounded-pill px-3 py-2 me-2" style="border-color: var(--border-light) !important;">
            <i class="fa-solid fa-moon me-1 text-muted"></i>
            <span th:text="${selectedNights}"></span> noches
            <a th:href="@{/listings(type=${selectedType},minPrice=${selectedMinPrice},maxPrice=${selectedMaxPrice},guests=${selectedGuests})}" class="ms-2 text-danger text-decoration-none fw-bold">×</a>
        </span>

        <span th:if="${selectedCity != null}" class="badge bg-light text-dark border rounded-pill px-3 py-2 me-2" style="border-color: var(--border-light) !important;">
            <i class="fa-solid fa-city me-1 text-muted"></i>
            <span th:text="${selectedCity}"></span>
            <a th:href="@{/listings(type=${selectedType},minPrice=${selectedMinPrice},maxPrice=${selectedMaxPrice},guests=${selectedGuests},nights=${selectedNights},startDate=${startDate},endDate=${endDate})}" class="ms-2 text-danger text-decoration-none fw-bold">×</a>
        </span>

        <span th:if="${startDate != null and startDate != ''}" class="badge bg-light text-dark border rounded-pill px-3 py-2 me-2" style="border-color: var(--border-light) !important;">
            <i class="fa-solid fa-calendar-day me-1 text-muted"></i>
            Desde: <span th:text="${startDate}"></span>
            <a th:href="@{/listings(type=${selectedType},minPrice=${selectedMinPrice},maxPrice=${selectedMaxPrice},guests=${selectedGuests},nights=${selectedNights},city=${selectedCity},endDate=${endDate})}" class="ms-2 text-danger text-decoration-none fw-bold">×</a>
        </span>

        <span th:if="${endDate != null and endDate != ''}" class="badge bg-light text-dark border rounded-pill px-3 py-2 me-2" style="border-color: var(--border-light) !important;">
            <i class="fa-solid fa-calendar-check me-1 text-muted"></i>
            Hasta: <span th:text="${endDate}"></span>
            <a th:href="@{/listings(type=${selectedType},minPrice=${selectedMinPrice},maxPrice=${selectedMaxPrice},guests=${selectedGuests},nights=${selectedNights},city=${selectedCity},startDate=${startDate})}" class="ms-2 text-danger text-decoration-none fw-bold">×</a>
        </span>
    </div>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">

        <div class="col" th:each="listing : ${listings}">
            <div class="card h-100 shadow-sm border position-relative" style="border-color: var(--border-light) !important; border-radius: 20px; overflow: hidden; background-color: #ffffff;">

                <div class="position-relative" style="height: 230px; width: 100%;">
                    <img th:if="${listing.imageUrl != null}"
                         th:src="@{${listing.imageUrl}}"
                         class="w-100 h-100"
                         style="object-fit: cover;"
                         alt="Imagen del alojamiento">

                    <div th:unless="${listing.imageUrl != null}"
                         class="w-100 h-100 d-flex align-items-center justify-content-center text-secondary" style="background-color: #f8f9fa;">
                        <i class="fa-solid fa-house-chimney fs-1 opacity-25"></i>
                    </div>

<!--                    <span th:if="${!listing.isActive}" class="badge bg-dark text-white position-absolute top-0 end-0 m-3 px-3 py-2 rounded-pill shadow-sm small fw-bold">-->
<!--                        Inactivo-->
<!--                    </span>-->

<!--                    <span th:if="${ratings.get(listing.id) != null}"-->
<!--                          class="badge bg-white text-dark position-absolute bottom-0 end-0 m-3 px-3 py-2 rounded-pill shadow-sm small fw-bold">-->
<!--                        <i class="fa-solid fa-star text-warning me-1"></i>-->
<!--                        <span th:text="${#numbers.formatDecimal(ratings.get(listing.id), 1, 1)}">4.5</span>-->
<!--                    </span>-->


                </div>

                <div class="card-body d-flex flex-column justify-content-between p-3">
                    <div>
                        <div class="d-flex justify-content-between align-items-start gap-2 mb-1">
                            <h5 class="h6 text-dark fw-bold mb-0 text-truncate flex-grow-1">
                                <span th:text="${listing.title}">Título de la casa</span>
                            </h5>
                            <div class="d-flex gap-1 flex-shrink-0">
                                <span th:if="${!listing.isActive}" class="badge bg-dark text-white rounded-pill small fw-bold">
                                    Inactivo
                                </span>
                                <span th:if="${ratings.get(listing.id) != null}" class="badge bg-light text-dark border rounded-pill small fw-bold" style="border-color: var(--border-light) !important;">
                                    <i class="fa-solid fa-star text-warning me-1"></i>
                                    <span th:text="${#numbers.formatDecimal(ratings.get(listing.id), 1, 1)}">4.5</span>
                                </span>
                            </div>
                        </div>

                        <p class="text-muted small mb-2">
                            <i class="fa-solid fa-location-dot me-1" style="font-size: 0.8rem;"></i>
                            <span th:text="${#strings.capitalize(#strings.toLowerCase(listing.city))}">Ciudad</span>
                        </p>

                        <p class="card-text text-secondary small mb-3"
                           style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 36px; line-height: 1.4;"
                           th:text="${listing.shortDescription}">
                            Descripción corta.
                        </p>
                    </div>

                    <div class="d-flex align-items-center justify-content-between pt-2 border-top mt-auto" style="border-color: var(--border-light) !important;">
                        <div>
                            <span class="fw-bold text-dark fs-5" th:text="${#numbers.formatCurrency(listing.pricePerNight)}">0,00 €</span>
                            <span class="text-muted small fw-medium">/ noche</span>
                        </div>
                        <div class="text-muted small fw-semibold">
                            <i class="fa-solid fa-users me-1"></i><span th:text="${listing.maxGuests}">0</span> máx.
                        </div>
                    </div>
                </div>

                <div class="card-footer bg-white border-0 pt-0 pb-3 px-3">
                    <div class="d-flex justify-content-between gap-2">

                        <a class="btn btn-airbnb btn-sm flex-fill fw-bold rounded-3 py-2 small"
                           th:href="@{/listings/{id}(id=${listing.id})}">
                            Ver detalle
                        </a>

                        <a class="btn btn-outline-secondary btn-sm flex-fill fw-bold rounded-3 py-2 small"
                           th:href="@{/listings/edit/{id}(id=${listing.id})}"
                           th:if="${currentUserEmail != null and (currentUserEmail == listing.owner.email or isAdmin)}" >
                            <i class="fa-solid fa-pen-to-square"></i>
                        </a>

                        <form th:action="@{/listings/toggle/{id}(id=${listing.id})}" method="post" class="flex-fill"
                              th:if="${currentUserEmail != null and (currentUserEmail == listing.owner.email or isAdmin)}">
                            <button type="submit"
                                    th:class="${listing.isActive} ? 'btn btn-outline-danger btn-sm w-100 fw-bold rounded-3 py-2 small' : 'btn btn-success btn-sm w-100 fw-bold rounded-3 py-2 small'">
                                <span th:text="${listing.isActive} ? 'Pausar' : 'Activar'"></span>
                            </button>
                        </form>

                    </div>
                </div>

            </div>
        </div>

    </div>

</main>

<footer th:replace="~{layout/footer :: footer}"></footer>
<script th:replace="~{layout/footer :: scripts}"></script>
<script>
    const checkInInput = document.getElementById('startDate');
    const checkOutInput = document.getElementById('endDate');

    // Configurar el min de hoy en la fecha de entrada
    const today = new Date().toISOString().split('T')[0];
    checkInInput.min = today;

    checkInInput.addEventListener('change', () => {
        if (checkInInput.value) {
            const minCheckOut = new Date(checkInInput.value);
            minCheckOut.setDate(minCheckOut.getDate() + 1);
            checkOutInput.min = minCheckOut.toISOString().split('T')[0];

            // Si endDate ya tiene un valor inválido, lo limpia
            if (checkOutInput.value && checkOutInput.value <= checkInInput.value) {
                checkOutInput.value = '';
            }
        }
    });

    // Al cargar la página, si ya hay startDate aplicar el mínimo
    if (checkInInput.value) {
        const minCheckOut = new Date(checkInInput.value);
        minCheckOut.setDate(minCheckOut.getDate() + 1);
        checkOutInput.min = minCheckOut.toISOString().split('T')[0];
    }
</script>
</body>
</html>
