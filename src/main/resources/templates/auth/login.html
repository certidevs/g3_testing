<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/head :: head('Iniciar sesión - openHouse')}"></head>
<body class="d-flex flex-column min-vh-100" style="background-color: #ffffff;">

<nav th:replace="~{layout/navbar :: navbar}"></nav>

<main class="container flex-grow-1 d-flex align-items-center justify-content-center my-5">
    <div class="card border rounded-4 shadow-sm" style="border-color: #EBEBEB !important; max-width: 450px; width: 100%; overflow: hidden; background-color: #ffffff;">

        <div class="card-header bg-white border-bottom p-4 text-center" style="border-color: #EBEBEB !important;">
            <h1 class="h4 mb-0 text-dark fw-bold" style="letter-spacing: -0.5px;">Iniciar sesión</h1>
        </div>

        <div class="card-body p-4">

            <div th:if="${param.error}" class="alert alert-danger d-flex align-items-center p-3 mb-4" style="border-radius: 12px; background-color: #FFF0F2; border-color: #FFD0D6; color: #E61E4D; font-size: 0.9rem;">
                <i class="fa-solid fa-circle-exclamation me-2.5"></i>
                <span>El correo electrónico o la contraseña son incorrectos.</span>
            </div>

            <div th:if="${param.logout}" class="alert alert-success d-flex align-items-center p-3 mb-4" style="border-radius: 12px; background-color: #E6F7ED; border-color: #C2F0D5; color: #117B34; font-size: 0.9rem;">
                <i class="fa-solid fa-circle-check me-2.5"></i>
                <span>Has cerrado sesión correctamente.</span>
            </div>

            <form th:action="@{/login}" method="post" class="d-flex flex-column gap-3">

                <div>
                    <label class="form-label small fw-bold text-dark mb-1">Correo electrónico</label>
                    <div class="input-group" style="border: 1px solid #DDDDDD; border-radius: 12px; background-color: #F7F7F7; overflow: hidden;">
                        <span class="input-group-text border-0 bg-transparent ps-3 pe-2 text-muted">
                            <i class="fa-regular fa-envelope" style="font-size: 0.9rem;"></i>
                        </span>
                        <input type="email" name="username" class="form-control border-0 bg-transparent shadow-none ps-1"
                               placeholder="ejemplo@mail.com" required style="font-size: 0.95rem; height: 46px;">
                    </div>
                </div>

                <div>
                    <label class="form-label small fw-bold text-dark mb-1">Contraseña</label>
                    <div class="input-group" style="border: 1px solid #DDDDDD; border-radius: 12px; background-color: #F7F7F7; overflow: hidden;">
                        <span class="input-group-text border-0 bg-transparent ps-3 pe-2 text-muted">
                            <i class="fa-solid fa-lock" style="font-size: 0.9rem;"></i>
                        </span>
                        <input type="password" name="password" class="form-control border-0 bg-transparent shadow-none ps-1"
                               placeholder="Introduce tu contraseña" required style="font-size: 0.95rem; height: 46px;">
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center my-1">
                    <div class="form-check">
                        <input class="form-check-input shadow-none" type="checkbox" id="remember-me" name="remember-me" style="cursor: pointer;">
                        <label class="form-check-label small text-muted user-select-none" for="remember-me" style="cursor: pointer;">
                            Recordarme en este equipo
                        </label>
                    </div>
                </div>

                <button type="submit" class="btn btn-airbnb w-100 d-flex align-items-center justify-content-center mt-2" style="border-radius: 12px; height: 48px; font-size: 1rem;">
                    Continuar
                </button>

            </form>

            <hr class="my-4" style="color: #DDDDDD;">

            <div class="text-center">
                <p class="text-muted small mb-0">
                    ¿No tienes una cuenta?
                    <a href="/register" class="text-dark fw-bold hover-underline ms-1 text-decoration-none">Regístrate</a>
                </p>
            </div>

        </div>
    </div>
</main>

<footer th:replace="~{layout/footer :: footer}"></footer>
<script th:replace="~{layout/footer :: scripts}"></script>

</body>
</html>
