<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/head :: head('Regístrate - openHouse')}"></head>
<body class="d-flex flex-column min-vh-100" style="background-color: #ffffff;">

<nav th:replace="~{layout/navbar :: navbar}"></nav>

<main class="container flex-grow-1 d-flex align-items-center justify-content-center my-5">
    <div class="card border rounded-4 shadow-sm" style="border-color: #EBEBEB !important; max-width: 500px; width: 100%; overflow: hidden; background-color: #ffffff;">

        <div class="card-header bg-white border-bottom p-4 text-center" style="border-color: #EBEBEB !important;">
            <h1 class="h4 mb-0 text-dark fw-bold" style="letter-spacing: -0.5px;">Crea tu cuenta</h1>
        </div>

        <div class="card-body p-4">

            <div th:if="${error}" class="alert alert-danger d-flex align-items-center p-3 mb-4" style="border-radius: 12px; background-color: #FFF0F2; border-color: #FFD0D6; color: #E61E4D; font-size: 0.9rem;">
                <i class="fa-solid fa-circle-exclamation me-2.5"></i>
                <span th:text="${error}">Error al registrarse.</span>
            </div>

            <form th:action="@{/register}" th:object="${registerDTO}" method="post" class="d-flex flex-column gap-3">

                <div>
                    <label class="form-label small fw-bold text-dark mb-1">Nombre y apellidos</label>
                    <div class="input-group" style="border: 1px solid #DDDDDD; border-radius: 12px; background-color: #F7F7F7; overflow: hidden;">
                        <span class="input-group-text border-0 bg-transparent ps-3 pe-2 text-muted">
                            <i class="fa-solid fa-id-card" style="font-size: 0.9rem;"></i>
                        </span>
                        <input type="text" th:field="*{name}" class="form-control border-0 bg-transparent shadow-none ps-1"
                               placeholder="Tu nombre completo" required style="font-size: 0.95rem; height: 44px;">
                    </div>
                </div>

                <div>
                    <label class="form-label small fw-bold text-dark mb-1">Nombre de usuario</label>
                    <div class="input-group" style="border: 1px solid #DDDDDD; border-radius: 12px; background-color: #F7F7F7; overflow: hidden;">
                        <span class="input-group-text border-0 bg-transparent ps-3 pe-2 text-muted">
                            <i class="fa-regular fa-user" style="font-size: 0.9rem;"></i>
                        </span>
                        <input type="text" th:field="*{username}" class="form-control border-0 bg-transparent shadow-none ps-1"
                               placeholder="Tu nombre o alias" required style="font-size: 0.95rem; height: 44px;">
                    </div>
                </div>

                <div>
                    <label class="form-label small fw-bold text-dark mb-1">Correo electrónico</label>
                    <div class="input-group" style="border: 1px solid #DDDDDD; border-radius: 12px; background-color: #F7F7F7; overflow: hidden;">
                        <span class="input-group-text border-0 bg-transparent ps-3 pe-2 text-muted">
                            <i class="fa-regular fa-envelope" style="font-size: 0.9rem;"></i>
                        </span>
                        <input type="email" th:field="*{email}" class="form-control border-0 bg-transparent shadow-none ps-1"
                               placeholder="ejemplo@mail.com" required style="font-size: 0.95rem; height: 44px;">
                    </div>
                </div>

                <div>
                    <label class="form-label small fw-bold text-dark mb-1">Contraseña</label>
                    <div class="input-group" style="border: 1px solid #DDDDDD; border-radius: 12px; background-color: #F7F7F7; overflow: hidden;">
                        <span class="input-group-text border-0 bg-transparent ps-3 pe-2 text-muted">
                            <i class="fa-solid fa-lock" style="font-size: 0.9rem;"></i>
                        </span>
                        <input type="password" th:field="*{password}" class="form-control border-0 bg-transparent shadow-none ps-1"
                               placeholder="Mínimo 6 caracteres" required style="font-size: 0.95rem; height: 44px;">
                    </div>
                </div>

                <div>
                    <label class="form-label small fw-bold text-dark mb-1">Confirmar contraseña</label>
                    <div class="input-group" style="border: 1px solid #DDDDDD; border-radius: 12px; background-color: #F7F7F7; overflow: hidden;">
                        <span class="input-group-text border-0 bg-transparent ps-3 pe-2 text-muted">
                            <i class="fa-solid fa-lock-open" style="font-size: 0.9rem;"></i>
                        </span>
                        <input type="password" th:field="*{passwordConfirmed}" class="form-control border-0 bg-transparent shadow-none ps-1"
                               placeholder="Repite tu contraseña" required style="font-size: 0.95rem; height: 44px;">
                    </div>
                </div>

                <div class="form-check mt-1">
                    <input class="form-check-input shadow-none" type="checkbox" th:field="*{acceptRGPD}" id="acceptRGPD" required style="cursor: pointer;">
                    <label class="form-check-label small text-muted user-select-none" for="acceptRGPD" style="cursor: pointer; line-height: 1.3;">
                        Acepto la política de privacidad, las condiciones del servicio y la normativa de protección de datos (RGPD).
                    </label>
                </div>

                <button type="submit" class="btn btn-airbnb w-100 d-flex align-items-center justify-content-center mt-2" style="border-radius: 12px; height: 48px; font-size: 1rem;">
                    Registrarse
                </button>

            </form>

            <hr class="my-4" style="color: #DDDDDD;">

            <div class="text-center">
                <p class="text-muted small mb-0">
                    ¿Ya tienes una cuenta en openHouse?
                    <a href="/login" class="text-dark fw-bold hover-underline ms-1 text-decoration-none">Inicia sesión</a>
                </p>
            </div>

        </div>
    </div>
</main>

<footer th:replace="~{layout/footer :: footer}"></footer>
<script th:replace="~{layout/footer :: scripts}"></script>

</body>
</html>
