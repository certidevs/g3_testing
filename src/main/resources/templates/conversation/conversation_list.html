<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head>
    <head th:replace="~{layout/head :: head('Mis Mensajes')}"></head>
</head>
<body class="d-flex flex-column min-vh-100" style="background-color: #ffffff;">

<nav th:replace="~{layout/navbar :: navbar}"></nav>

<main class="container flex-grow-1 my-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center gap-3 mb-4">
                <div>
                    <h1 class="h3 mb-0 text-dark fw-bold" style="letter-spacing: -0.5px;">Bandeja de entrada</h1>
                </div>
                <div class="d-flex w-100 w-sm-auto align-items-center gap-2 style='max-width: 450px;'">
                    <button class="btn btn-airbnb px-3 py-2" data-bs-toggle="modal" data-bs-target="#newConversationModal" style="border-radius: 24px; font-size: 0.9rem; font-weight: 500;">
                        <i class="fa-solid fa-plus me-1"></i> Nueva conversación
                    </button>
                    <form th:action="@{/conversation}" method="get" class="flex-grow-1" style="max-width: 280px;">
                        <div class="input-group" style="border: 1px solid #DDDDDD; border-radius: 24px; padding: 2px 4px; background-color: #F7F7F7;">
                            <input type="text" name="search" class="form-control border-0 bg-transparent shadow-none ps-3" th:value="${param.search}" placeholder="Buscar conversación..." style="font-size: 0.9rem;">
                            <button class="btn btn-airbnb d-flex align-items-center justify-content-center p-0" type="submit" style="width: 32px; height: 32px; border-radius: 50% !important;">
                                <i class="fa-solid fa-magnifying-glass" style="font-size: 0.8rem;"></i>
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <div th:if="${conversations == null || conversations.isEmpty()}" class="text-center py-5 border rounded-4 my-4" style="border-color: #EBEBEB !important; background-color: #F7F7F7;">
                <i class="fa-regular fa-comments text-muted mb-3" style="font-size: 2.5rem;"></i>
                <p class="mt-2 text-dark fw-medium mb-1">No tienes mensajes todavía.</p>
                <p class="text-muted small mb-4">Cuando te comuniques con un anfitrión, tus mensajes aparecerán aquí.</p>
                <button class="btn btn-airbnb px-4 me-2" data-bs-toggle="modal" data-bs-target="#newConversationModal" style="border-radius: 24px;">Iniciar chat</button>
                <a href="/listings" class="btn btn-airbnb-outline px-4" style="border-radius: 24px;">Explorar alojamientos</a>
            </div>

            <div th:each="conv : ${conversations}" class="card card-conversation mb-3 border" style="border-color: #EBEBEB !important; background-color: #ffffff; cursor: pointer;"
                 th:onclick="|window.location.href='/conversation/' + ${conv.booking.id}|">
                <div class="card-body p-4">
                    <div class="d-flex align-items-center">

                        <div class="avatar-circle me-3 d-flex align-items-center justify-content-center" style="width: 48px; height: 48px; background-color: #FF385C; color: #ffffff; border-radius: 50%; font-weight: bold;">
                            <span th:text="${#strings.substring(conv.booking.listing.owner.name, 0, 1)}">U</span>
                        </div>

                        <div class="flex-grow-1">
                            <div class="d-flex justify-content-between align-items-baseline mb-1">
                                <h2 class="h6 mb-0 text-dark fw-bold" th:text="${conv.booking.listing != null ? conv.booking.listing.title : 'Reserva sin título'}" style="font-size: 1rem;">
                                    Título del Alojamiento
                                </h2>
                                <small class="text-muted fw-normal" th:text="${#temporals.format(conv.booking.checkIn, 'dd MMM')}" style="font-size: 0.85rem;">
                                    15 May
                                </small>
                            </div>

                            <p class="text-muted mb-2 small" style="font-size: 0.85rem;">
                                Anfitrión: <span class="text-dark fw-medium" th:text="${conv.booking.listing.owner.name}">Nombre Host</span>
                            </p>

                            <div class="d-flex gap-2 align-items-center">
                                <span class="badge bg-light text-dark border px-2 py-1" style="border-color: #DDDDDD !important; font-weight: 500; font-size: 0.75rem; border-radius: 4px;">
                                    Reserva #<span th:text="${conv.booking.id}">001</span>
                                </span>
                                <span th:if="${conv.booking.status.name() == 'CONFIRMED'}" class="badge px-2 py-1" style="background-color: #E6F7ED; color: #117B34; font-weight: 600; font-size: 0.75rem; border-radius: 4px;">Confirmada</span>
                            </div>
                        </div>

                        <div class="ms-3 text-muted opacity-50">
                            <i class="fa-solid fa-chevron-right" style="font-size: 0.9rem;"></i>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</main>

<div class="modal fade" id="newConversationModal" tabindex="-1" aria-labelledby="newConversationModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow" style="border-radius: 16px;">
            <div class="modal-header border-bottom p-4">
                <h5 class="modal-title fw-bold text-dark" id="newConversationModalLabel" style="letter-spacing: -0.5px;">Nueva conversación</h5>
                <button type="button" class="btn-close shadow-none" data-bs-content="modal" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form th:action="@{/conversation/new}" method="post">
                <div class="modal-body p-4">
                    <div class="mb-3">
                        <label for="bookingSelect" class="form-label text-dark small fw-bold">Selecciona tu alojamiento o reserva</label>
                        <select id="bookingSelect" name="bookingId" class="form-select shadow-none p-3" style="border-radius: 8px; font-size: 0.9rem; border-color: #DDDDDD;" required>
                            <option value="" disabled selected>Elige una de tus estancias...</option>
                            <option th:each="b : ${bookings}" th:value="${b.id}"
                                    th:text="${b.listing.title + ' (Reserva #' + b.id + ') - ' + (b.listing.owner.id == #authentication.principal.id ? 'Anfitrión' : 'Huésped')}">
                            </option>
                        </select>
                    </div>
                    <div class="mb-2">
                        <label for="messageContent" class="form-label text-dark small fw-bold">Mensaje inicial</label>
                        <textarea id="messageContent" name="content" class="form-control shadow-none p-3" rows="4" placeholder="Escribe un mensaje" style="border-radius: 8px; font-size: 0.9rem; border-color: #DDDDDD; resize: none;" required></textarea>
                    </div>
                </div>
                <div class="modal-footer border-top p-3 d-flex justify-content-end gap-2">
                    <button type="button" class="btn btn-light px-4 py-2 text-dark" data-bs-dismiss="modal" style="border-radius: 8px; font-size: 0.9rem; font-weight: 500;">Cancelar</button>
                    <button type="submit" class="btn btn-airbnb px-4 py-2" style="border-radius: 8px; font-size: 0.9rem; font-weight: 500;">Enviar mensaje</button>
                </div>
            </form>
        </div>
    </div>
</div>

<footer th:replace="~{layout/footer :: footer}"></footer>

<script th:replace="~{layout/footer :: scripts}"></script>

</body>
</html>
