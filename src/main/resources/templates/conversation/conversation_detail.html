<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
    <head th:replace="~{layout/head :: head('Conversación - openHouse')}"></head>
<body class="d-flex flex-column min-vh-100" style="background-color: #ffffff;">

<nav th:replace="~{layout/navbar :: navbar}"></nav>

<main class="container flex-grow-1 my-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card border rounded-4 shadow-sm" style="border-color: #EBEBEB !important; overflow: hidden;">

                <div class="card-header bg-white border-bottom d-flex justify-content-between align-items-center py-3 px-4" style="border-color: #EBEBEB !important;">
                    <div class="d-flex align-items-center gap-2">
                        <i class="fa-solid fa-door-open text-airbnb fs-5"></i>
                        <h1 class="h6 mb-0 text-dark fw-bold" style="font-size: 1.05rem;">
                            Reserva #<span th:text="${conversation.booking.id}">0</span>
                        </h1>
                    </div>
                    <span class="badge bg-light text-dark border px-2.5 py-1" style="border-color: #DDDDDD !important; font-weight: 500; font-size: 0.8rem; border-radius: 4px;" th:text="${#lists.size(messages)} + ' mensajes'">0</span>
                </div>

                <div class="card-body" id="chat-container">
                    <div th:if="${#lists.isEmpty(messages)}" class="text-center py-5 my-auto">
                        <i class="fa-regular fa-comment-dots text-muted mb-3" style="font-size: 2.5rem;"></i>
                        <p class="text-muted small mb-0">No hay mensajes en esta conversación. ¡Escribe el primero!</p>
                    </div>

                    <div th:each="msg, msgStat : ${messages}"
                         class="message-row"
                         th:classappend="${msg.sender.id == #authentication.principal.id ? 'guest-style align-items-end' : 'owner-style align-items-start'}">

                        <div class="mw-75 position-relative">
                            <span class="user-label"
                                  th:classappend="${msg.sender.id == #authentication.principal.id ? 'text-end' : ''}"
                                  th:text="${msg.sender.name}">Nombre</span>

                            <div class="bubble shadow-sm">
                                <div th:id="'content-' + ${msg.id}" th:text="${msg.content}">Contenido</div>
                                <span class="time-label" th:text="${msg.sentAt != null ? #temporals.format(msg.sentAt, 'HH:mm') : '--:--'}">Hora</span>
                            </div>

                            <div th:if="${msg.sender.id == #authentication.principal.id && msgStat.last && msg.isRead}"
                                 class="text-end text-muted small mt-1" style="font-size: 0.75rem; font-weight: 500;">
                                <i class="fa-solid fa-check-double text-airbnb me-1"></i> Visto
                            </div>

                            <div class="message-options" th:if="${msg.sender.id == #authentication.principal.id}">
                                <button type="button" class="btn-option"
                                        th:onclick="'openEditModal(' + ${conversation.id} + ',' + ${msg.id} + ')'">
                                    <i class="fa-solid fa-pen"></i>
                                </button>
                                <form th:action="@{/conversation/{cId}/message/{mId}/delete(cId=${conversation.id}, mId=${msg.id})}" method="POST" class="m-0">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                    <button type="submit" class="btn-option delete">
                                        <i class="fa-solid fa-trash-can"></i>
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card-footer bg-white p-4 border-top" style="border-color: #EBEBEB !important;">
                    <form th:action="@{/conversation/{id}/send(id=${conversation.booking.id})}" method="POST" class="d-flex gap-2">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <input type="text" name="content" class="form-control px-3" placeholder="Escribe tu mensaje aquí..." required autocomplete="off" style="border-color: #DDDDDD; border-radius: 12px; font-size: 0.95rem;">
                        <button class="btn btn-airbnb d-flex align-items-center justify-content-center px-4" type="submit" style="border-radius: 12px;">
                            <i class="fa-solid fa-paper-plane"></i>
                        </button>
                    </form>
                    <div class="text-center mt-4">
                        <a th:href="@{/conversation}" class="text-secondary text-decoration-none hover-underline small fw-medium">
                            <i class="fa-solid fa-chevron-left me-1.5" style="font-size: 0.75rem;"></i> Volver a conversaciones
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="border-radius: 16px; border: none; box-shadow: 0 8px 28px rgba(0,0,0,0.15);">
            <form id="editForm" method="POST">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <div class="modal-header px-4 pt-4 pb-2 border-0">
                    <h5 class="modal-title fw-bold text-dark" style="letter-spacing: -0.5px;">Editar mensaje</h5>
                    <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal" aria-label="Close" style="font-size: 0.8rem;"></button>
                </div>
                <div class="modal-body px-4 py-2">
                    <textarea name="content" id="editContent" class="form-control p-3" rows="3" required style="border-color: #DDDDDD; border-radius: 12px; font-size: 0.95rem; resize: none;"></textarea>
                </div>
                <div class="modal-footer px-4 pb-4 pt-2 border-0 gap-2">
                    <button type="button" class="btn btn-airbnb-outline px-4 py-2" data-bs-dismiss="modal" style="font-size: 0.9rem; margin: 0;">Cancelar</button>
                    <button type="submit" class="btn btn-airbnb px-4 py-2" style="font-size: 0.9rem; margin: 0; border-radius: 24px !important;">Guardar cambios</button>
                </div>
            </form>
        </div>
    </div>
</div>

<footer th:replace="~{layout/footer :: footer}"></footer>

<script th:replace="~{layout/footer :: scripts}"></script>

<script>
    const chatContainer = document.getElementById('chat-container');
    if (chatContainer) {
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function openEditModal(convId, msgId) {
        const content = document.getElementById('content-' + msgId).innerText;
        document.getElementById('editContent').value = content;
        document.getElementById('editForm').action = '/conversation/' + convId + '/message/' + msgId + '/edit';
        new bootstrap.Modal(document.getElementById('editModal')).show();
    }
</script>

</body>
</html>
